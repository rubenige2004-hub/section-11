name: Auto-Sync Intervals.icu Data
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Write Sync Script
        run: |
          cat << 'EOF' > inline_sync.py
          import json, os, requests
          
          if __name__ == "__main__":
              api_key = os.environ.get("INTERVALS_ICU_API_KEY")
              athlete_id = os.environ.get("INTERVALS_ICU_ATHLETE_ID")
              
              if not api_key or not athlete_id:
                  raise Exception("Faltan las credenciales en los secretos de GitHub")
              
              # Corregido: Se añade la barra final '/' para evitar que el ID se pegue al dominio
              url = f"https://intervals.icu{athlete_id}/wellness"
              
              # Autenticación oficial usando API_KEY como usuario y tu clave como contraseña
              response = requests.get(url, auth=('API_KEY', api_key))
              
              if response.status_code != 200:
                  raise Exception(f"Error de Intervals.icu: Codigo {response.status_code}.")
                  
              data = response.json()
              with open("dossier.json", "w") as f:
                  json.dump(data, f, indent=4)
              print("Datos deportivos guardados con éxito")
          EOF

      - name: Run Sync Script
        env:
          INTERVALS_ICU_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}
          INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}
        run: python inline_sync.py

      - name: Commit and Push dossier.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dossier.json
          git commit -m "Automated update of Intervals.icu data" || exit 0
          git push

