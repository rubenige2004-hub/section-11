name: Auto-Sync Intervals.icu Data
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Descargar Datos de Intervals
        env:
          KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}
          ATHLETE: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}
        run: |
          # Usamos curl nativo para evitar que la consola intercepte la URL construida
          curl -s -u "API_KEY:$KEY" "https://intervals.icu" -o dossier.json
          
          # Verificar si el archivo se descargo con contenido real o dio error
          if [ ! -s dossier.json ]; then
            echo "Error: El archivo dossier.json quedo vacio."
            exit 1
          fi

      - name: Commit and Push dossier.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dossier.json
          git commit -m "Automated update of Intervals.icu data" || exit 0
          git push
