name: Sincronizacion Sin Bloqueos
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Write Sync Script
        run: |
          cat << 'EOF' > inline_sync.py
          import json, os, requests, sys
          
          if __name__ == "__main__":
              api_key = os.environ.get("INTERVALS_ICU_API_KEY")
              
              if not api_key or len(sys.argv) < 2:
                  raise Exception("Faltan credenciales o argumentos de ejecucion.")
              
              athlete_id = sys.argv[1]
              
              # Direccion limpia construida mediante argumentos puros
              url = f"https://intervals.icu{athlete_id}/wellness"
              
              # Peticion usando cabecera de User-Agent simulando navegador para evitar bloqueos de Cloudflare
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                  "accept": "application/json"
              }
              
              response = requests.get(url, auth=('API_KEY', api_key), headers=headers)
              
              if response.status_code != 200:
                  raise Exception(f"Error de Intervals.icu: Codigo {response.status_code}.")
                  
              data = response.json()
              with open("dossier.json", "w") as f:
                  json.dump(data, f, indent=4)
              print("Datos deportivos sincronizados correctamente.")
          EOF

      - name: Run Sync Script
        env:
          INTERVALS_ICU_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}
        run: python inline_sync.py "${{ secrets.INTERVALS_ICU_ATHLETE_ID }}"

      - name: Commit and Push dossier.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dossier.json
          git commit -m "Automated update of Intervals.icu data" || exit 0
          git push

